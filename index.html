<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pumpkin Viewer</title>
<style>
  :root {
    --bg: #f2f1ee; --panel: rgba(255,255,255,.82); --text: #1c1c1c;
    --muted: #6b6b6b; --line: rgba(0,0,0,.1); --accent: #b4532a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151515; --panel: rgba(30,30,30,.82); --text: #ececec;
      --muted: #9a9a9a; --line: rgba(255,255,255,.12); --accent: #e0814f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  header { position: fixed; top: 16px; left: 16px; right: 16px; display: flex;
    justify-content: flex-end; align-items: center; gap: 12px; pointer-events: none; }
  header > * { pointer-events: auto; }
  .menu { position: relative; }
  .bar { position: absolute; top: calc(100% + 6px); right: 0; display: flex; flex-direction: column;
    gap: 2px; min-width: 140px; background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
  #menu-toggle { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; }
  button { appearance: none; border: 0; background: transparent; color: var(--text); text-align: left;
    font: inherit; padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--line); }
  .bar button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .slider { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; }
  .slider span { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .slider output { color: var(--muted); }
  .slider input { width: 100%; accent-color: var(--accent); }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    text-align: center; color: var(--muted); }
  #progress { width: 220px; height: 3px; background: var(--line); border-radius: 2px;
    margin: 10px auto 0; overflow: hidden; }
  #progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  #drop { position: fixed; inset: 12px; border: 2px dashed var(--accent); border-radius: 14px;
    display: none; place-items: center; font-size: 16px; color: var(--accent);
    background: color-mix(in srgb, var(--bg) 70%, transparent); }
  body.dragging #drop { display: grid; }
  .hidden { display: none !important; }
  dialog { max-width: min(420px, calc(100vw - 32px)); background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 8px; font-size: 16px; }
  dialog p { margin: 0 0 10px; }
  dialog .muted { color: var(--muted); font-size: 12px; }
  dialog form { display: flex; justify-content: flex-end; }
  dialog form button { background: var(--accent); color: #fff; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>

<header>
  <div class="menu">
    <button id="menu-toggle" aria-expanded="false" aria-controls="menu-bar" title="Options (M)">Options ▾</button>
    <div class="bar hidden" id="menu-bar">
      <button id="reset" title="Reset camera (R)">Reset view</button>
      <button id="spin" aria-pressed="true" title="Auto-rotate (A)">Rotate</button>
      <button id="grid" aria-pressed="false" title="Show base grid (G)">Grid</button>
      <label class="slider" title="Scale the key light and environment light">
        <span>Light <output id="light-value">0.40</output></span>
        <input id="light" type="range" min="0" max="2" step="0.05" value="0.4">
      </label>
      <button id="about-open">About</button>
    </div>
  </div>
</header>

<div id="status"><div id="msg">Loading model…</div><div id="progress"><i></i></div></div>
<div id="drop">Drop a .usdz file to load it</div>

<dialog id="about">
  <h2>About</h2>
  <p>Pumpkin is a 3D viewer for USDZ models.</p>
  <p>Drag to rotate. Scroll to zoom. Right-drag to pan.<br>
    Keys: <kbd>R</kbd> reset view · <kbd>A</kbd> rotate · <kbd>G</kbd> grid · <kbd>M</kbd> menu</p>
  <p class="muted">Rendering is paused while this dialog is open.</p>
  <form method="dialog"><button>Close</button></form>
</dialog>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { USDLoader } from 'three/addons/loaders/USDLoader.js';

const DEFAULT_MODEL = 'models/pumpkin_raw.usdz';

const $ = (id) => document.getElementById(id);
const canvas = $('view');

// Renderer, scene, camera.
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(2, 3, 2);
scene.add(key);

const camera = new THREE.PerspectiveCamera(40, 1, 0.001, 1000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotateSpeed = 1.5;
controls.autoRotate = true; // Rotate on startup. The "Rotate" button stops it.

const grid = new THREE.GridHelper(1, 20, 0x888888, 0x888888);
grid.material.transparent = true;
grid.material.opacity = 0.25;
grid.visible = false; // The "Grid" button shows it.
scene.add(grid);

function syncBackground() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  scene.background = new THREE.Color(dark ? 0x151515 : 0xf2f1ee);
}
syncBackground();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncBackground);

let home = null; // Camera target and model radius for "Reset view".
let userMoved = false; // True after the user drags, zooms or pans.

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  // Keep the model in view when the window size changes,
  // until the user moves the camera.
  if (home && !userMoved) resetView();
}
addEventListener('resize', resize);
resize();

// Model state.
let model = null;

function frame(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  // Put the model on the ground plane at the origin.
  object.position.sub(new THREE.Vector3(center.x, box.min.y, center.z));
  const radius = size.length() / 2 || 1;

  grid.scale.setScalar(radius * 4);
  camera.near = radius / 100;
  camera.far = radius * 100;
  camera.updateProjectionMatrix();

  home = { radius, target: new THREE.Vector3(0, size.y / 2, 0) };
  controls.minDistance = radius * 0.2;
  controls.maxDistance = radius * 10;
  resetView();
  console.info('Model size (m):', size.toArray(), 'radius:', radius);

  return size;
}

// Distance at which a sphere of the given radius fits in the view.
// Use the smaller of the vertical and horizontal FOV, so the model
// also fits in a narrow window.
function fitDistance(radius) {
  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const margin = 1.35;
  return (radius / Math.sin(Math.min(vFov, hFov) / 2)) * margin;
}

controls.addEventListener('start', () => { userMoved = true; });

function resetView() {
  if (!home) return;
  const dir = new THREE.Vector3(1, 0.6, 1).normalize();
  camera.position.copy(home.target).addScaledVector(dir, fitDistance(home.radius));
  controls.target.copy(home.target);
  controls.update();
  userMoved = false;
}

function setStatus(text, pct) {
  $('status').classList.toggle('hidden', text == null);
  if (text != null) $('msg').textContent = text;
  $('progress').classList.toggle('hidden', pct == null);
  if (pct != null) $('progress').firstElementChild.style.width = `${pct}%`;
}

function disposeModel() {
  if (!model) return;
  scene.remove(model);
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry.dispose();
    [].concat(o.material).forEach((m) => {
      Object.values(m).forEach((v) => v?.isTexture && v.dispose());
      m.dispose();
    });
  });
  model = null;
}

function showModel(object) {
  disposeModel();
  model = object;
  scene.add(model);
  frame(model);
  setStatus(null);
}

const loader = new USDLoader();

async function loadFromUrl(url, name) {
  setStatus('Loading model…', 0);
  try {
    const object = await loader.loadAsync(url, (e) => {
      if (e.lengthComputable) setStatus(`Loading model… ${Math.round(e.loaded / 1e6)} / ${Math.round(e.total / 1e6)} MB`, (e.loaded / e.total) * 100);
    });
    showModel(object);
  } catch (err) {
    console.error(err);
    const hint = location.protocol === 'file:'
      ? 'Open this page through a local web server, not as a file:// URL.'
      : 'Drop a .usdz file on the page.';
    setStatus(`Could not load ${name}. ${hint}`);
  }
}

async function loadFromFile(file) {
  setStatus(`Reading ${file.name}…`);
  try {
    const buffer = await file.arrayBuffer();
    const object = loader.parse(buffer);
    showModel(object);
  } catch (err) {
    console.error(err);
    setStatus(`Could not parse ${file.name}.`);
  }
}

// Options menu.
function toggleSpin() {
  controls.autoRotate = !controls.autoRotate;
  $('spin').setAttribute('aria-pressed', String(controls.autoRotate));
}

function setMenuOpen(open) {
  $('menu-bar').classList.toggle('hidden', !open);
  $('menu-toggle').setAttribute('aria-expanded', String(open));
}

$('menu-toggle').onclick = () => setMenuOpen($('menu-bar').classList.contains('hidden'));
$('reset').onclick = resetView;
$('spin').onclick = toggleSpin;

// About dialog. Stop the render loop while the dialog is open,
// and start it again when the dialog closes.
$('about-open').onclick = () => {
  setMenuOpen(false);
  renderer.setAnimationLoop(null);
  $('about').showModal();
};
$('about').addEventListener('close', () => {
  renderer.setAnimationLoop(render);
});

function toggleGrid() {
  grid.visible = !grid.visible;
  $('grid').setAttribute('aria-pressed', String(grid.visible));
}
$('grid').onclick = toggleGrid;

// Light slider. The value scales the key light and the environment light.
const KEY_INTENSITY = key.intensity;
function setLight(value) {
  key.intensity = KEY_INTENSITY * value;
  scene.environmentIntensity = value;
  $('light-value').textContent = value.toFixed(2);
}
$('light').oninput = (e) => setLight(Number(e.target.value));
setLight(Number($('light').value)); // Apply the default value (0.4).

// Close the menu when the user clicks outside it.
addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.menu')) setMenuOpen(false);
});

addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('about').open) return; // No shortcuts while the About dialog is open.
  const k = e.key.toLowerCase();
  if (k === 'r') resetView();
  else if (k === 'a') toggleSpin();
  else if (k === 'g') toggleGrid();
  else if (k === 'm') setMenuOpen($('menu-bar').classList.contains('hidden'));
  else if (k === 'escape') setMenuOpen(false);
});

// Drag and drop.
let dragDepth = 0;
addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const file = e.dataTransfer.files[0];
  if (file) loadFromFile(file);
});

function render() {
  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(render);

loadFromUrl(DEFAULT_MODEL, DEFAULT_MODEL);
</script>
</body>
</html>
